# Automatický deploy na Websupport cez FTPS.
#
# Aktivácia (jednorazovo v GitHub repo nastaveniach):
#   1. Settings → Secrets and variables → Actions → Variables:
#        WEBSUPPORT_DEPLOY = true
#   2. Settings → Secrets and variables → Actions → Secrets:
#        WEBSUPPORT_FTP_HOST     (napr. i-studio.sk)
#        WEBSUPPORT_FTP_USER
#        WEBSUPPORT_FTP_PASSWORD
#        WEBSUPPORT_FTP_DIR      (koreňový adresár webu z pohľadu FTP účtu, napr. ./ alebo /web/)
#
# Kým premenná WEBSUPPORT_DEPLOY nie je "true", workflow sa preskočí.

name: Deploy to Websupport

on:
  push:
    branches: [main]
  workflow_dispatch:

# nikdy nespúšťať dva FTP mirrory naraz
concurrency:
  group: deploy-websupport
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.WEBSUPPORT_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.WEBSUPPORT_FTP_HOST }}
      FTP_USER: ${{ secrets.WEBSUPPORT_FTP_USER }}
      FTP_DIR: ${{ secrets.WEBSUPPORT_FTP_DIR }}
      # lftp číta heslo z LFTP_PASSWORD (open --env-password) — nikdy sa nevkladá do príkazu,
      # takže úvodzovky či spätné lomky v hesle nič nerozbijú
      LFTP_PASSWORD: ${{ secrets.WEBSUPPORT_FTP_PASSWORD }}
    steps:
      # prázdny secret by inak potichu namieril "mirror --delete" na koreň FTP účtu
      - name: Check deploy secrets
        run: |
          for v in FTP_HOST FTP_USER FTP_DIR LFTP_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret for $v is empty — refusing to deploy"
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install lftp
        run: sudo apt-get install -y -qq lftp

      # FTP-Deploy-Action tu nefunguje (Websupport vyžaduje TLS session reuse, knižnica
      # basic-ftp ho nepodporuje), preto lftp.
      #
      # Poradie je dôležité, aby web počas nahrávania nikdy neodkazoval na súbory, ktoré ešte
      # neexistujú:
      #  1. _astro (hashované CSS/JS/obrázky) — len pridať nové, staré zatiaľ nechať
      #  2. src/photos (originály pre administráciu)
      #  3. HTML/PHP/.htaccess — až keď sú ich assety na serveri; porovnanie podľa času aj
      #     veľkosti, takže zmenený súbor sa nahrá vždy (aj keď má rovnakú veľkosť)
      #  4. upratanie _astro — zmazať assety, na ktoré už žiadna stránka neodkazuje
      # Pri _astro a src stačí porovnať veľkosť (--ignore-time): názvy sú hashované, resp.
      # originály fotiek; inak by sa 250 MB nahrávalo pri každom deployi, lebo checkout
      # dáva všetkým súborom nový čas.
      #
      # Certifikát FTP servera je vystavený na *.r6.websupport.sk — hostname sa dá overiť len
      # keď je WEBSUPPORT_FTP_HOST tento názov (ftp.r6.websupport.sk), nie i-studio.sk.
      - name: Upload dist via FTPS (lftp)
        run: |
          case "$FTP_HOST" in
            *.websupport.sk) CHECK_HOSTNAME=yes ;;
            *) CHECK_HOSTNAME=no
               echo "::warning::WEBSUPPORT_FTP_HOST is '$FTP_HOST' — certificate hostname not verified. Set it to ftp.r6.websupport.sk to enable full TLS verification." ;;
          esac
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ssl:check-hostname $CHECK_HOSTNAME;
            set net:max-retries 2;
            set net:timeout 30;
            open -u \"$FTP_USER\" --env-password \"$FTP_HOST\";
            mirror -R --parallel=4 --no-perms --ignore-time --verbose=1 dist/_astro/ \"$FTP_DIR/_astro/\";
            mirror -R --delete --parallel=4 --no-perms --ignore-time --verbose=1 dist/src/ \"$FTP_DIR/src/\";
            mirror -R --delete --parallel=4 --no-perms --verbose=1 -x '^src/' -x '^_astro/' dist/ \"$FTP_DIR\";
            mirror -R --delete --parallel=4 --no-perms --ignore-time --verbose=1 dist/_astro/ \"$FTP_DIR/_astro/\";
          "
