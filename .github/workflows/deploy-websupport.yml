# Automatický deploy na Websupport cez FTP.
#
# Aktivácia (jednorazovo v GitHub repo nastaveniach):
#   1. Settings → Secrets and variables → Actions → Variables:
#        WEBSUPPORT_DEPLOY = true
#   2. Settings → Secrets and variables → Actions → Secrets:
#        WEBSUPPORT_FTP_HOST     (napr. i-studio.sk alebo ftp.websupport.sk)
#        WEBSUPPORT_FTP_USER
#        WEBSUPPORT_FTP_PASSWORD
#        WEBSUPPORT_FTP_DIR      (koreňový adresár webu, napr. /web/)
#
# Kým premenná WEBSUPPORT_DEPLOY nie je "true", workflow sa preskočí —
# Netlify medzitým slúži ako testovací hosting.

name: Deploy to Websupport

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.WEBSUPPORT_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # lftp namiesto FTP-Deploy-Action: Websupport FTPS vyžaduje TLS session reuse,
      # ktorý knižnica basic-ftp nepodporuje ("Server sent FIN packet unexpectedly")
      - name: Upload dist via FTPS (lftp)
        env:
          FTP_HOST: ${{ secrets.WEBSUPPORT_FTP_HOST }}
          FTP_USER: ${{ secrets.WEBSUPPORT_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.WEBSUPPORT_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.WEBSUPPORT_FTP_DIR }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 2;
            set net:timeout 30;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            mirror -R --delete --parallel=4 --no-perms --verbose=1 dist/ \"$FTP_DIR\";
          "
