backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'Add {{collection}} — {{slug}}'
    update: 'Update {{collection}} — {{slug}}'
    delete: 'Delete {{collection}} — {{slug}}'
    uploadMedia: 'Add photo {{path}}'
    deleteMedia: 'Remove photo {{path}}'

locale: sk
site_url: https://www.i-studio.sk
logo_url: https://www.i-studio.sk/favicon.png

media_folder: src/photos
public_folder: /src/photos

collections:
  - name: galerie
    label: Galérie
    description: 'Fotografie realizácií podľa kategórií. Fotky môžete pridávať, mazať aj meniť ich poradie (potiahnutím za ikonu s čiarkami).'
    files:
      - name: podlahy
        label: Podlahy
        file: src/data/galerie/podlahy.json
        fields:
          - label: Fotografie
            name: photos
            widget: list
            label_singular: fotografiu
            summary: '{{fields.image}}'
            fields:
              - label: Fotka
                name: image
                widget: image
                media_folder: '/src/photos/podlahy'
                public_folder: '/src/photos/podlahy'
      - name: dvere
        label: Dvere
        file: src/data/galerie/dvere.json
