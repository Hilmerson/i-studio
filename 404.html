<!doctype html>
<html lang="sk">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>i-studio | 404 Stránka nenájdená</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Manrope:wght@200;300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/css/global.css">
    <link rel="stylesheet" href="/src/css/layout.css">
    <style>
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .error-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .error-code {
            font-family: var(--font-display);
            font-size: clamp(8rem, 30vw, 20rem);
            font-weight: 700;
            line-height: 0.8;
            color: transparent;
            -webkit-text-stroke: 2px #fff;
            opacity: 0.8;
            position: relative;
            z-index: 1;
        }

        .error-message {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 5vw, 3rem);
            margin-top: -20px;
            margin-bottom: 40px;
            z-index: 2;
            font-weight: 300;
        }

        .btn-home {
            padding: 15px 40px;
            background: #fff;
            color: #000;
            border-radius: 50px;
            text-transform: uppercase;
            font-weight: 600;
            font-family: var(--font-display);
            transition: transform 0.3s;
            z-index: 2;
        }

        .btn-home:hover {
            transform: scale(1.05);
            background: var(--color-brand-yellow);
        }

        .noise-overlay {
            opacity: 0.05;
        }
    </style>
</head>

<body>
    <div class="noise-overlay"></div>

    <div class="error-container">
        <h1 class="error-code">404</h1>
        <p class="error-message">Stránka sa stratila v priestore.</p>
        <a href="/" class="btn-home">Späť na Domov</a>
    </div>

</body>

</html>
